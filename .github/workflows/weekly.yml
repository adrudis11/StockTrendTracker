# The weekly run, outside Claude sessions: on Saturday morning, score the week, write
# the review (`stt review`), join the weekday digests into the week's digest, run the
# analysis (`stt analyze`), make the week's one-month picks, log them to the ledger,
# write the report, commit data/ and publish the dashboard on GitHub Pages. These are
# the only Claude API calls in the project since 2026-11-11 (the owner's choice on
# 2026-11-10); weekdays only collect data (daily.yml).
#
# Unattended, the review only proposes changes to the theme map and the analysis prompt;
# apply them yourself or in a Claude session (prompts/weekly_run.md).
#
# It is started by daily.yml on Saturdays and Sundays, from the same cron-job.org call
# at 06:00 Paris time (STT_RUNNER = `off` pauses it there). GitHub's own schedules were
# removed on 2026-11-14 at the owner's request, since GitHub started them hours late.
# A run on Sunday still makes Saturday's picks, and a run for a week that is already
# recorded does nothing (`stt weekly prepare` prints NOTHING TO DO). The theme priors are
# refreshed when they are a month old (`stt weekly finish`). Rebuild the universe
# (`stt universe build`) by hand now and then and review its diff.
#
# Run it by hand from the Actions tab: with "test" ticked (the default) it does the
# week up to today with the real review and analysis (about $1.50 of API), keeps them
# as downloadable files, and records, commits and publishes nothing. Unticked, it does
# the latest Saturday's week now if it isn't recorded yet.

name: Weekly run

on:
  workflow_dispatch:
    inputs:
      test:
        description: "Test only: review and analysis to downloadable files, record nothing"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

env:
  START: "2026-11-04"

defaults:
  run:
    shell: bash # -eo pipefail

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          STT_RUNNER: ${{ vars.STT_RUNNER }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            go=true
          elif [ "$STT_RUNNER" = off ] ||
            { [ "$STT_RUNNER" != github ] && [[ "$(date -u +%F)" < "$START" ]]; }; then
            go=false
            echo "Scheduled runs are off (start $START, STT_RUNNER=${STT_RUNNER:-unset})."
          else
            go=true
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  run:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: pipeline
      cancel-in-progress: false
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_STOCKTRACKER }}
      STT_SEC_CONTACT: ${{ secrets.STT_SEC_CONTACT }}
      TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
    outputs:
      publish: ${{ steps.site.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch as it is now, not the commit the run was triggered on, so a run
          # that waited for the pipeline lock sees a week recorded meanwhile.
          ref: ${{ github.ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked

      - name: The week's date
        run: |
          if [ "$TEST" = true ]; then
            week=$(date -u +%F) # a test does the week up to today
          else
            week=$(date -u -d "-$((($(date -u +%u) + 1) % 7)) days" +%F) # the latest Saturday
          fi
          echo "WEEK=$week" >> "$GITHUB_ENV"
          echo "The week to $week"

      - name: Prepare (prices, news, filings, scoring of matured picks, the week's digest)
        id: prepare
        run: |
          log="$RUNNER_TEMP/prepare.log"
          test_flag=$([ "$TEST" = true ] && echo --test || true)
          if ! uv run stt weekly prepare --day "$WEEK" $test_flag | tee "$log"; then
            echo "A data source failed; trying once more in a minute."
            sleep 60
            uv run stt weekly prepare --day "$WEEK" $test_flag | tee "$log"
          fi
          if grep -q "NOTHING TO DO" "$log"; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - name: Review the week (Claude API)
        if: steps.prepare.outputs.skip != 'true'
        run: |
          out=()
          if [ "$TEST" = true ]; then mkdir -p "$RUNNER_TEST_DIR"; out=(--out "$RUNNER_TEST_DIR/review.md"); fi
          uv run stt review --day "$WEEK" "${out[@]}" ||
            { echo "Retrying in a minute."; sleep 60; uv run stt review --day "$WEEK" "${out[@]}"; } ||
            echo "::warning::The review failed twice; going on with the analysis."
        env:
          RUNNER_TEST_DIR: ${{ runner.temp }}/test
      - name: Analyse the week (Claude API)
        if: steps.prepare.outputs.skip != 'true'
        run: |
          out=()
          if [ "$TEST" = true ]; then mkdir -p "$RUNNER_TEST_DIR"; out=(--out "$RUNNER_TEST_DIR/events.json"); fi
          uv run stt analyze --day "$WEEK" "${out[@]}" ||
            { echo "Retrying in a minute."; sleep 60; uv run stt analyze --day "$WEEK" "${out[@]}"; }
        env:
          RUNNER_TEST_DIR: ${{ runner.temp }}/test
      - name: Keep the test review and analysis
        if: env.TEST == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: test-week
          path: |
            ${{ runner.temp }}/test/
            cache/raw/*/digest.md
            cache/raw/*/feedback.md
            data/usage/api.jsonl
          if-no-files-found: ignore

      - name: Finish (picks, ledger, report, dashboard data)
        if: env.TEST != 'true' && steps.prepare.outputs.skip != 'true'
        run: uv run stt weekly finish --day "$WEEK"
      - name: Commit and push data/
        if: env.TEST != 'true' && steps.prepare.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          events=$(jq '.events | length' "data/events/$WEEK.json")
          picks=$(jq '.picks | length' "data/picks/$WEEK.json")
          git commit -q -m "Weekly run $WEEK: $events events, $picks picks (GitHub Actions)"
          for wait in 2 4 8 16; do
            git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep "$wait"
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Build the dashboard site
        id: site
        if: env.TEST != 'true' && steps.prepare.outputs.skip != 'true'
        run: |
          uv run stt site
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        if: steps.site.outputs.publish == 'true'
        with:
          path: site

  deploy:
    needs: run
    if: needs.run.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
