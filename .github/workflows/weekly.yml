# The Saturday review, outside Claude sessions: refresh prices, score the week's
# matured picks and analysis calls, and write data/reviews/<date>.md through the
# Claude API (`stt review`). Unattended, it proposes changes to the theme map and the
# analysis prompt but makes none; apply them yourself or in a Claude session.
#
# Like the daily run, scheduled runs start on START (the first is 2026-11-07), and
# the repository variable STT_RUNNER overrides that (`github` now, `off` paused).
# GitHub starts scheduled runs late or drops them, so Sunday is a fallback: a
# scheduled run does nothing when a review from the last four days exists.
# The monthly upkeep needs no step here: `stt daily finish` refreshes the theme
# priors when they are a month old. Rebuild the universe (`stt universe build`) by
# hand now and then and review its diff.
#
# Run it by hand from the Actions tab: with "test" ticked (the default) the review
# goes to a downloadable file and nothing is committed.

name: Weekly review

on:
  schedule:
    - cron: "41 8 * * 6" # Saturdays 08:41 UTC
    - cron: "41 8 * * 0" # Sunday fallback
  workflow_dispatch:
    inputs:
      test:
        description: "Test only: write the review to a downloadable file, commit nothing"
        type: boolean
        default: true

permissions:
  contents: write

env:
  START: "2026-11-04"

defaults:
  run:
    shell: bash # -eo pipefail

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          STT_RUNNER: ${{ vars.STT_RUNNER }}
        run: |
          last=$(find data/reviews -name '*.md' -printf '%f\n' 2>/dev/null | sort | tail -1)
          last=${last%.md}
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            go=true
          elif [ "$STT_RUNNER" = off ] ||
            { [ "$STT_RUNNER" != github ] && [[ "$(date -u +%F)" < "$START" ]]; }; then
            go=false
            echo "Scheduled runs are off (start $START, STT_RUNNER=${STT_RUNNER:-unset})."
          elif [[ -n "$last" && ! "$last" < "$(date -u -d '4 days ago' +%F)" ]]; then
            go=false
            echo "This week's review is already written ($last)."
          else
            go=true
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  review:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: pipeline
      cancel-in-progress: false
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_STOCKTRACKER }}
      TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Score the week
        run: |
          uv run stt ingest --skip rss --skip federal_register --skip gdelt_events \
            --skip gdelt_doc --skip polymarket
          uv run stt evaluate
          uv run stt scoreboard
          uv run stt feedback
      - name: Write the review (Claude API)
        run: |
          if [ "$TEST" = true ]; then
            mkdir -p "$RUNNER_TEMP/test"
            uv run stt review --out "$RUNNER_TEMP/test/review.md"
          else
            uv run stt review || { echo "Retrying in a minute."; sleep 60; uv run stt review; }
          fi
      - name: Keep the test review
        if: env.TEST == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: test-review
          path: |
            ${{ runner.temp }}/test/
            data/usage/api.jsonl
          if-no-files-found: ignore
      - name: Commit and push data/
        if: env.TEST != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git commit -q -m "Weekly review $(date -u +%F) (GitHub Actions)"
          for wait in 2 4 8 16; do
            git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep "$wait"
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          git push origin "HEAD:$GITHUB_REF_NAME"
