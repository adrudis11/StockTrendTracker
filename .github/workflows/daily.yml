# The weekday collection, outside Claude sessions: prices, news, House and SEC filings,
# scoring of matured picks, the day's news digest, a commit of data/ and the dashboard
# on GitHub Pages. It calls no API and makes no picks: since 2026-11-11 the picks are
# made once a week, on Saturdays (weekly.yml), from the week's digests.
#
# Only an outside cron service starts it: cron-job.org (the owner's account, README "On
# time every morning") calls it at 06:00 Paris time every day with trigger=cron, so the
# dashboard is fresh before 07:30. GitHub's own schedules were removed on 2026-11-14 at
# the owner's request: GitHub started them hours late (07:12-07:44 UTC for 00:47) or
# dropped them. If the cron call fails, cron-job.org emails the owner; each run reads
# the news since the last digest (24 to 96 hours), so a missed day leaves no gap. A
# second run on the same day only refreshes prices, scores and the dashboard. The
# repository variable STT_RUNNER (Settings > Secrets and variables > Actions >
# Variables) = `off` pauses the cron calls' runs (and so the weekly run); runs started
# by hand always go.
#
# On Saturdays and Sundays (UTC) the same call starts the weekly run instead
# (weekly.yml: review, analysis, the week's picks), so one cron job runs every day at
# 06:00 Paris and covers both. Sunday is a fallback: a week already recorded does
# nothing there (2026-11-14, the owner's choice).
#
# Run it by hand from the Actions tab: with "test" ticked (the default) it collects on
# the runner, keeps the digest as a downloadable file and commits and publishes
# nothing. Unticked, it does the day now (on a weekend: starts the weekly run).

name: Daily collection

on:
  workflow_dispatch:
    inputs:
      test:
        description: "Test only: collect, but commit and publish nothing"
        type: boolean
        default: true
      trigger:
        description: "Who starts it: the outside cron service sends 'cron'"
        type: choice
        options: [manual, cron]
        default: manual

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write # to start the weekly run on weekends

env:
  START: "2026-11-04" # first run started by the cron service

defaults:
  run:
    shell: bash # -eo pipefail

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
      weekend: ${{ steps.check.outputs.weekend }}
    steps:
      - id: check
        env:
          STT_RUNNER: ${{ vars.STT_RUNNER }}
          TRIGGER: ${{ inputs.trigger }}
        run: |
          if [ "$(date -u +%u)" -ge 6 ]; then weekend=true; else weekend=false; fi
          echo "weekend=$weekend" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$TRIGGER" != cron ]; then
            go=true # started by hand
          elif [ "$STT_RUNNER" = off ] ||
            { [ "$STT_RUNNER" != github ] && [[ "$(date -u +%F)" < "$START" ]]; }; then
            go=false
            echo "Scheduled runs are off (start $START, STT_RUNNER=${STT_RUNNER:-unset})."
          else
            go=true
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  weekly:
    # On weekends: start the weekly run (Saturday's picks; on Sunday a recorded week
    # does nothing). A workflow_dispatch made with GITHUB_TOKEN does start a new run.
    needs: gate
    if: >-
      needs.gate.outputs.go == 'true' && needs.gate.outputs.weekend == 'true' &&
      !(github.event_name == 'workflow_dispatch' && inputs.test && inputs.trigger != 'cron')
    runs-on: ubuntu-latest
    steps:
      - name: Start the weekly run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run weekly.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f test=false
          echo "Started the weekly run (weekly.yml) for the week to the latest Saturday."

  run:
    needs: gate
    if: needs.gate.outputs.go == 'true' && needs.gate.outputs.weekend != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: pipeline
      cancel-in-progress: false
    env:
      STT_SEC_CONTACT: ${{ secrets.STT_SEC_CONTACT }}
      # the outside cron trigger always does the day, whatever it sends as `test`
      TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test && inputs.trigger != 'cron' }}
    outputs:
      publish: ${{ steps.site.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch as it is now, not the commit the run was triggered on: a run
          # that waited for the pipeline lock must see what was committed meanwhile
          # (2026-11-10).
          ref: ${{ github.ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked

      - name: Collect (prices, news, filings, matured picks, digest, dashboard data)
        id: collect
        run: |
          log="$RUNNER_TEMP/collect.log"
          if ! uv run stt collect | tee "$log"; then
            echo "A data source failed; trying once more in a minute."
            sleep 60
            uv run stt collect | tee "$log"
          fi
          if grep -q "NOTHING TO DO" "$log"; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - name: Keep the test collection
        if: env.TEST == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: test-collection
          path: |
            data/digests/
            cache/raw/*/digest.md
            cache/raw/*/ingest_report.json
          if-no-files-found: ignore

      - name: Commit and push data/
        if: env.TEST != 'true' && steps.collect.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          day=$(date -u +%F)
          stories=$(jq '.stories | length' "data/digests/$day.json")
          git commit -q -m "Collect $day: $stories stories (GitHub Actions)"
          for wait in 2 4 8 16; do
            git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep "$wait"
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Build the dashboard site
        id: site
        if: env.TEST != 'true' && steps.collect.outputs.skip != 'true'
        run: |
          uv run stt site
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        if: steps.site.outputs.publish == 'true'
        with:
          path: site

  deploy:
    needs: run
    if: needs.run.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
