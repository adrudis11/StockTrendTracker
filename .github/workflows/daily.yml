# The weekday collection, outside Claude sessions: prices, news, House and SEC filings,
# scoring of matured picks, the day's news digest, a commit of data/ and the dashboard
# on GitHub Pages. It calls no API and makes no picks: since 2026-11-11 the picks are
# made once a week, on Saturdays (weekly.yml), from the week's digests.
#
# Scheduled runs start on START (below). The repository variable STT_RUNNER (Settings >
# Secrets and variables > Actions > Variables) overrides the date: `github` runs them
# now, `off` pauses them (and the weekly run).
#
# The exact time no longer matters: each run reads the news since the last digest (24
# to 96 hours), so a late or dropped run leaves no gap. GitHub often starts the
# schedules below hours late. The outside cron service (cron-job.org, README "Exact
# timing"), if it is set up, starts it at 06:00 Paris time with trigger=cron. A second
# run on the same day only refreshes prices, scores and the dashboard.
#
# Run it by hand from the Actions tab: with "test" ticked (the default) it collects on
# the runner, keeps the digest as a downloadable file and commits and publishes
# nothing. Unticked, it does the day now.

name: Daily collection

on:
  schedule:
    - cron: "47 4 * * 1-5"
    - cron: "17 9 * * 1-5" # collects if the first was dropped, else refreshes the dashboard
  workflow_dispatch:
    inputs:
      test:
        description: "Test only: collect, but commit and publish nothing"
        type: boolean
        default: true
      trigger:
        description: "Who starts it: the outside cron service sends 'cron'"
        type: choice
        options: [manual, cron]
        default: manual

permissions:
  contents: write
  pages: write
  id-token: write

env:
  START: "2026-11-04" # first scheduled run

defaults:
  run:
    shell: bash # -eo pipefail

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          STT_RUNNER: ${{ vars.STT_RUNNER }}
          TRIGGER: ${{ inputs.trigger }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$TRIGGER" != cron ]; then
            go=true # started by hand
          elif [ "$STT_RUNNER" = off ] ||
            { [ "$STT_RUNNER" != github ] && [[ "$(date -u +%F)" < "$START" ]]; }; then
            go=false
            echo "Scheduled runs are off (start $START, STT_RUNNER=${STT_RUNNER:-unset})."
          else
            go=true
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  run:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: pipeline
      cancel-in-progress: false
    env:
      STT_SEC_CONTACT: ${{ secrets.STT_SEC_CONTACT }}
      # the outside cron trigger always does the day, whatever it sends as `test`
      TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test && inputs.trigger != 'cron' }}
    outputs:
      publish: ${{ steps.site.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch as it is now, not the commit the run was triggered on: a run
          # that waited for the pipeline lock must see what was committed meanwhile
          # (2026-11-10).
          ref: ${{ github.ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked

      - name: Collect (prices, news, filings, matured picks, digest, dashboard data)
        id: collect
        run: |
          log="$RUNNER_TEMP/collect.log"
          if ! uv run stt collect | tee "$log"; then
            echo "A data source failed; trying once more in a minute."
            sleep 60
            uv run stt collect | tee "$log"
          fi
          if grep -q "NOTHING TO DO" "$log"; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - name: Keep the test collection
        if: env.TEST == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: test-collection
          path: |
            data/digests/
            cache/raw/*/digest.md
            cache/raw/*/ingest_report.json
          if-no-files-found: ignore

      - name: Commit and push data/
        if: env.TEST != 'true' && steps.collect.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          day=$(date -u +%F)
          stories=$(jq '.stories | length' "data/digests/$day.json")
          git commit -q -m "Collect $day: $stories stories (GitHub Actions)"
          for wait in 2 4 8 16; do
            git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep "$wait"
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Build the dashboard site
        id: site
        if: env.TEST != 'true' && steps.collect.outputs.skip != 'true'
        run: |
          uv run stt site
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        if: steps.site.outputs.publish == 'true'
        with:
          path: site

  deploy:
    needs: run
    if: needs.run.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
