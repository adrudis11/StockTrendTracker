# Non-stock instruments downloaded every day alongside the stock universe.
# All tickers are Yahoo Finance symbols and were checked to return data on 2026-10-28.
#
# kind:
#   benchmark   what picks are measured against
#   index       market indices (context, not tradable)
#   sector_etf  one per GICS sector, used for "did it beat its sector?"
#   theme_etf   industries and themes that geopolitics moves directly
#   country_etf country exposure
#   macro       volatility, rates, currencies, commodities (market regime)

benchmarks:
  US: SPY
  Europe: EXSA.DE

instruments:
