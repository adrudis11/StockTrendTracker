# Geopolitical themes -> stocks and ETFs they move.
#
# Each theme is a situation that can intensify (impact direction +1) or ease (-1).
# `members` maps a ticker to a signed weight in [-1, 1]: positive means it tends to
# rise when the theme intensifies, negative means it tends to fall. Weights are
# judgement calls, kept coarse on purpose (1 = core exposure, 0.5 = partial,
# 0.3 = incidental). Every ticker must be in data/universe/stocks.csv or
# config/instruments.yaml (checked by the tests).
#
# `driver` is a price series that tracks the theme (optional). Phase 4 uses it to
# measure how members historically reacted after big moves in the driver.
#
# Changes are proposed by Claude in the weekly review and reviewed in git.

